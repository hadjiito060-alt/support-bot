<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<title>MyVala Support Bot</title>

<style>

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f5f9;
}

.container{

    width:80%;
    max-width:900px;

    margin:auto;

    padding:30px;
}

h1{

    text-align:center;

    color:#1565c0;
}

.subtitle{

    text-align:center;

    color:gray;

    margin-bottom:30px;
}

.chat{

    background:white;

    border-radius:15px;

    padding:20px;

    box-shadow:0 0 15px rgba(0,0,0,.1);

    min-height:350px;
}

.user{

    text-align:right;

    margin-bottom:25px;
}

.user .bubble{

    display:inline-block;

    background:#1565c0;

    color:white;

    padding:15px;

    border-radius:15px 15px 0 15px;

    max-width:75%;
}

.bot{

    margin-bottom:25px;
}

.bot .bubble{

    display:inline-block;

    background:#eeeeee;

    padding:15px;

    border-radius:15px 15px 15px 0;

    max-width:75%;

    line-height:1.6;
}

form{

    margin-top:25px;

    display:flex;

    gap:10px;
}

input{

    flex:1;

    padding:15px;

    font-size:16px;

    border-radius:10px;

    border:1px solid #ccc;
}

button{

    width:70px;

    background:#1565c0;

    color:white;

    border:none;

    border-radius:10px;

    font-size:22px;

    cursor:pointer;
}

button:hover{

    background:#0d47a1;
}

.bot a{

    color:#1565c0;

    text-decoration:none;

    font-weight:bold;
}
.typing{
    display:none;
    margin-top:20px;
}

.typing span{
    display:inline-block;
    width:10px;
    height:10px;
    margin:3px;
    border-radius:50%;
    background:#1565c0;
    animation:typing 1.2s infinite;
}

.typing span:nth-child(2){
    animation-delay:0.2s;
}

.typing span:nth-child(3){
    animation-delay:0.4s;
}

@keyframes typing{
    0%,80%,100%{
        transform:scale(.5);
        opacity:.5;
    }

    40%{
        transform:scale(1);
        opacity:1;
    }
}
</style>

</head>

<body>

<div class="container">

<h1>🤖 MyVala Support Bot</h1>

<p class="subtitle">

Assistant IA basé sur la base de connaissances MyVala

</p>

<div class="chat">

{% if question %}

<div class="user">

<b>Vous</b><br><br>

<div class="bubble">

{{ question }}

</div>

</div>

{% endif %}

{% if answer %}

<div class="bot">

<b>Bot</b><br><br>

<div class="bubble">

{{ answer|safe }}

</div>

</div>

{% endif %}

</div>

<form method="POST" id="chatForm">

<input
name="question"
placeholder="Posez votre question..."
required>

<button type="submit">
➤
</button>

</form>

<div id="loading" class="typing">
    <span></span>
    <span></span>
    <span></span>
</div>

<script>
document.getElementById("chatForm").addEventListener("submit", function () {
    document.getElementById("loading").style.display = "block";
});
</script>
</body>

</html>
